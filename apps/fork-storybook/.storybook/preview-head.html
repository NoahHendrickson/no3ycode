<style>
  /* The app locks the window and scrolls its own panes (index.css body { overflow: hidden });
     a story or docs page is the whole document, so it has to scroll. */
  html body {
    overflow: auto;
  }
  /* appearance.ts wraps the story mount in the app's #root (the Glass popup cutout masks it);
     index.css sizes that to a locked window, so here it grows with the story instead. */
  html body #root {
    height: auto;
    overflow: visible;
  }

  /* Glass stands in for a macOS 26+ main window (appearance.ts): Liquid Glass under the docked
     sidebar only. The app clears html, body and that sidebar, so the page paints the window's
     backing (forkSidebarVibrancy.ts) and the sidebar paints the glass as measured on screen over
     it, the colour a menu reaching past the sidebar takes (theme.custom.palettes.css). A menu
     wholly over the sidebar shows that glass in the app, so it takes the same colour here. */
  html[data-fork-sidebar-vibrancy="liquid-glass"] {
    --story-liquid-glass: color-mix(in srgb, #ffffff 4%, #141618);
    /* An image layer, not a colour: Glass clears html's background-color. */
    background-image: linear-gradient(#141618, #141618);
  }
  html[data-fork-sidebar-vibrancy="liquid-glass"][data-fork-glass-3d="off"] {
    --story-liquid-glass: #2a2324;
    background-image: linear-gradient(#1f1c1b, #1f1c1b);
  }
  html[data-fork-sidebar-vibrancy="liquid-glass"]
    :is(
      [data-slot="sidebar-wrapper"]:not([data-fork-sidebar-overlay="true"])
        [data-slot="sidebar-container"][data-sidebar-version="v2"],
      [data-fork-liquid-glass-popup="glass"]
    ) {
    background-image: linear-gradient(
      var(--story-liquid-glass),
      var(--story-liquid-glass)
    ) !important;
  }
</style>

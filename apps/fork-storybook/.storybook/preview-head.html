<style>
  /* The app locks the window and scrolls its own panes (index.css body { overflow: hidden });
     a story or docs page is the whole document, so it has to scroll. */
  html body {
    overflow: auto;
  }
  /* appearance.ts wraps the story mount in the app's #root (the Glass popup cutout masks it);
     index.css sizes that to a locked window, so here it grows with the story instead. */
  html body #root {
    height: auto;
    overflow: visible;
  }

  /* The app clears html, body and the docked sidebar over Liquid Glass (appearance.ts), so the
     page paints the window's backing (forkSidebarVibrancy.ts), and the sidebar and the popups cut
     through to it paint the glass's measured colour. An image layer: Glass clears html's colour. */
  html[data-fork-sidebar-vibrancy="liquid-glass"] {
    background-image: linear-gradient(#141618, #141618);
  }
  html[data-fork-sidebar-vibrancy="liquid-glass"][data-fork-glass-3d="off"] {
    background-image: linear-gradient(#1d1d1d, #1d1d1d);
  }
  html[data-fork-sidebar-vibrancy="liquid-glass"]
    :is(
      [data-slot="sidebar-wrapper"]:not([data-fork-sidebar-overlay="true"])
        [data-slot="sidebar-container"][data-sidebar-version="v2"],
      [data-fork-liquid-glass-popup="glass"]
    ) {
    background-image: linear-gradient(
      var(--fork-liquid-glass-sidebar),
      var(--fork-liquid-glass-sidebar)
    ) !important;
  }
</style>
